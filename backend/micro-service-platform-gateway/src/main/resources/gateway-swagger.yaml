knife4j:
  gateway:
    enabled: true
    strategy: manual
    routes:
      - name: IAM Server
        url: /iam/v3/api-docs?group=default
        context-path: /iam
        service-name: micro-service-platform-iam
        order: 2
      - name: Dev Suite
        url: /suite/v3/api-docs?group=default
        context-path: /suite
        service-name: micro-service-platform-suite
        order: 3
      - name: Wms 存储管理
        url: /wms/v3/api-docs?group=default
        context-path: /wms
        service-name: micro-service-platform-wms
        order: 3
